---
name: Build

on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # true when a push on the main branch
  PUSH_ARTIFACT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  # The toolchain comes from mise.toml; never download another one, never edit go.mod.
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  GOWORK: "off"
  # Install npm-backend tools (renovate) with aube, which enforces supply-chain trust policies.
  MISE_NPM_PACKAGE_MANAGER: aube

jobs:
  linters:
    runs-on: ubuntu-latest
    name: linters
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      # Same command as `mise run check` locally; the slow profile adds govulncheck.
      - name: hk check
        run: mise exec -- hk check --all
        env:
          HK_PROFILE: slow

  mod-tidy:
    name: mod-tidy
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go
          cache: true
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go mod verify
        run: go mod verify

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go
          cache: true
      - run: mise run vet
      - name: unit tests
        run: go test -race -shuffle=on -count=1 -timeout 10m -short ./...

  # Integration tests need the private pgfresh module, so they only run where
  # PGFRESH_TOKEN is available: pushes and PRs from branches in this repository.
  # Fork PRs show these checks as skipped.
  integration:
    name: integration (pg${{ matrix.postgres }})
    runs-on: ubuntu-latest
    needs: [mod-tidy, linters]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "15", "16", "17", "18"]
        include:
          - postgres: "19beta4"
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      POSTGRES_IMAGE: postgres:${{ matrix.postgres }}-alpine
      PGFRESH_ID: postgres_exporter-pg${{ matrix.postgres }}
      PGFRESH_RETRY: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go golangci-lint
          cache: true
      - name: Configure access to private modules
        env:
          PGFRESH_TOKEN: ${{ secrets.PGFRESH_TOKEN }}
        run: |
          if [ -z "$PGFRESH_TOKEN" ]; then
            echo "::warning::PGFRESH_TOKEN is not set; private modules cannot be fetched"
            exit 0
          fi
          echo "::add-mask::$PGFRESH_TOKEN"
          git config --global \
            url."https://x-access-token:${PGFRESH_TOKEN}@github.com/rnaveiras/pgfresh".insteadOf \
            "https://github.com/rnaveiras/pgfresh"
      # The integration tests are their own Go module so the private pgfresh dependency stays out of the
      # exporter's go.mod.
      - name: go mod download
        working-directory: integration
        run: go mod download
      - name: lint the integration module
        if: matrix.postgres == '18'
        run: mise run lint:integration
      - name: integration module go.mod is tidy
        if: matrix.postgres == '18'
        working-directory: integration
        run: go mod tidy -diff
      - name: Pull Postgres image
        run: docker pull "$POSTGRES_IMAGE"
      - name: integration tests
        working-directory: integration
        run: go test -race -shuffle=on -count=1 -timeout 10m ./...

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [mod-tidy, linters, unit]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go go:github.com/prometheus/promu
          cache: true
      - run: go version
      - name: Build
        run: mise run build

  container:
    runs-on: ubuntu-latest
    needs: [linters, mod-tidy, build, integration]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      packages: write
      contents: read
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          install: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: ${{ env.PUSH_ARTIFACT }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
