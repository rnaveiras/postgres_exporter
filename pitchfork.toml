#:schema https://pitchfork.jdx.dev/schema.json
# Local development stack. `mise run stack:up` starts it; see CONTRIBUTING.md.
# Every Postgres major gets its own host port (54<major>) so several can run side by side.
namespace = "pgexp"

[env]
PGUSER = "postgres"
PGPASSWORD = "postgres"

# ---- PG14 ----------------------------------------------------------------------------------------

[daemons.pg14]
run = "exec docker run --rm --name pgexp-pg14 -p 5414:5432 -e POSTGRES_PASSWORD=$PGPASSWORD -v $PWD/docker/postgresql.conf:/etc/postgresql/postgresql.conf:ro postgres:14-alpine postgres -c config_file=/etc/postgresql/postgresql.conf -c shared_preload_libraries=pg_stat_statements"
ready_cmd = "docker exec pgexp-pg14 pg_isready -h 127.0.0.1 -U postgres"
stop_signal = { signal = "SIGTERM", timeout = "20s" }
hooks = { on_exit = "docker rm -f pgexp-pg14 >/dev/null 2>&1 || true" }

# Creates the monitoring role and pg_stat_statements. Idempotent, reruns on every start.
[daemons.seed-pg14]
run = "docker exec -i pgexp-pg14 psql -U postgres -v ON_ERROR_STOP=1 < docker/sql/monitoring-role.sql"
oneshot = true
depends = ["pg14"]

# Exporter from source, connected as the least-privilege role. Restarts on Go changes.
[daemons.exporter-pg14]
run = "exec go run . --log.level=debug --web.listen-address=127.0.0.1:9187"
mise = true
depends = ["seed-pg14"]
watch = ["**/*.go", "go.mod", "go.sum"]
port = 9187
ready_http = "http://127.0.0.1:9187/metrics"
stop_signal = { signal = "SIGINT", timeout = "10s" }
env = { PGHOST = "127.0.0.1", PGPORT = "5414", PGUSER = "postgres_exporter", PGPASSWORD = "postgres_exporter", PGDATABASE = "postgres", PGSSLMODE = "disable" }

