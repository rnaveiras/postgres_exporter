# ---- Prometheus + Grafana ------------------------------------------------------------------------
# Host networking: Prometheus scrapes the exporter on 127.0.0.1:9187 whichever major it points at.

[daemons.prometheus]
run = "exec docker run --rm --name pgexp-prometheus --network host -v $PWD/docker/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro quay.io/prometheus/prometheus:v3.13.1"
ready_http = "http://127.0.0.1:9090/-/ready"
stop_signal = { signal = "SIGTERM", timeout = "10s" }
hooks = { on_exit = "docker rm -f pgexp-prometheus >/dev/null 2>&1 || true" }

[daemons.grafana]
run = "exec docker run --rm --name pgexp-grafana --network host -e GF_SECURITY_ADMIN_USER=admin -e GF_SECURITY_ADMIN_PASSWORD=admin -e GF_USERS_ALLOW_SIGN_UP=false -e PROMETHEUS_URL=http://127.0.0.1:9090 -v $PWD/docker/grafana/provisioning:/etc/grafana/provisioning:ro -v $PWD/docker/grafana/dashboards:/etc/grafana/dashboards:ro grafana/grafana:13.2.2"
depends = ["prometheus"]
ready_http = "http://127.0.0.1:3000/api/health"
stop_signal = { signal = "SIGTERM", timeout = "10s" }
hooks = { on_exit = "docker rm -f pgexp-grafana >/dev/null 2>&1 || true" }

# ---- Groups --------------------------------------------------------------------------------------

[groups.default]
daemons = ["pg18", "seed-pg18", "exporter-pg18", "prometheus", "grafana"]

[groups.matrix]
daemons = ["seed-pg14", "seed-pg15", "seed-pg16", "seed-pg17", "seed-pg18"]

[groups.beta]
daemons = ["seed-pg19beta"]

[groups.all]
daemons = [
  "pg14", "pg15", "pg16", "pg17", "pg18", "pg19beta",
  "seed-pg14", "seed-pg15", "seed-pg16", "seed-pg17", "seed-pg18", "seed-pg19beta",
  "exporter-pg14", "exporter-pg15", "exporter-pg16", "exporter-pg17", "exporter-pg18", "exporter-pg19beta",
  "prometheus", "grafana",
]
