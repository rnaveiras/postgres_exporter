---
# Prometheus config for the pitchfork stack (host networking, see pitchfork.toml).
# docker/prometheus.yml is the compose equivalent with service-name targets.
global:
  scrape_interval: 10s
  scrape_timeout: 10s
  evaluation_interval: 10s

  external_labels:
    monitor: "postgres-exporter"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: "postgres"
    static_configs:
      - targets: ["127.0.0.1:9187"]
